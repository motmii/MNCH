  <text xml:space="preserve" x="190" y="132" font-family="Consolas, 'Cascadia Code', monospace" font-size="12.5" fill="#D4D4D4"><tspan x="190" y="132"><tspan fill="#C586C0">import</tspan> <tspan fill="#9CDCFE">random</tspan></tspan><tspan x="190" y="184"><tspan fill="#C586C0">def</tspan> <tspan fill="#DCDCAA">bubble_sort</tspan>(arr):</tspan><tspan x="190" y="210">    n = <tspan fill="#4EC9B0">len</tspan>(arr)</tspan><tspan x="190" y="236">    <tspan fill="#C586C0">for</tspan> i <tspan fill="#C586C0">in</tspan> <tspan fill="#4EC9B0">range</tspan>(n - <tspan fill="#B5CEA8">1</tspan>):</tspan><tspan x="190" y="262">        swapped = <tspan fill="#569CD6">False</tspan></tspan><tspan x="190" y="288">        <tspan fill="#C586C0">for</tspan> j <tspan fill="#C586C0">in</tspan> <tspan fill="#4EC9B0">range</tspan>(n - i - <tspan fill="#B5CEA8">1</tspan>):</tspan><tspan x="190" y="314">            <tspan fill="#C586C0">if</tspan> arr[j] &gt; arr[j + <tspan fill="#B5CEA8">1</tspan>]:</tspan><tspan x="190" y="340">                arr[j], arr[j+<tspan fill="#B5CEA8">1</tspan>] = arr[j+<tspan fill="#B5CEA8">1</tspan>], arr[j]</tspan><tspan x="190" y="366">                swapped = <tspan fill="#569CD6">True</tspan></tspan><tspan x="190" y="392">        <tspan fill="#C586C0">if</tspan> <tspan fill="#C586C0">not</tspan> swapped:</tspan><tspan x="190" y="418">            <tspan fill="#C586C0">break</tspan></tspan><tspan x="190" y="444">    <tspan fill="#C586C0">return</tspan> arr</tspan></text>
