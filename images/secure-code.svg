    <text x="100" y="130" fill="#8b5cf6">function</text><text x="165" y="130" fill="#22d3ee"> sanitizeInput</text><text x="270" y="130" fill="#a0a0b4">(userInput) {</text>
    <text x="115" y="155" fill="#8b5cf6">const</text><text x="160" y="155" fill="#00ff41">clean</text><text x="210" y="155" fill="#a0a0b4">= userInput.</text><text x="320" y="155" fill="#f472b6">replace</text><text x="375" y="155" fill="#a0a0b4">(/&lt;[^&gt;]*&gt;/g, </text><text x="495" y="155" fill="#f59e0b">''</text><text x="510" y="155" fill="#a0a0b4">);</text>
    <text x="115" y="180" fill="#8b5cf6">if</text><text x="140" y="180" fill="#a0a0b4">(!</text><text x="152" y="180" fill="#00ff41">clean</text><text x="195" y="180" fill="#a0a0b4">)</text><text x="215" y="180" fill="#f472b6">throw new Error</text><text x="340" y="180" fill="#a0a0b4">(</text><text x="350" y="180" fill="#f59e0b">'Empty input'</text><text x="430" y="180" fill="#a0a0b4">);</text>
    <text x="115" y="205" fill="#8b5cf6">return</text><text x="168" y="205" fill="#00ff41">clean</text><text x="212" y="205" fill="#a0a0b4">.</text><text x="220" y="205" fill="#f472b6">trim</text><text x="252" y="205" fill="#a0a0b4>();</text>
    <text x="100" y="230" fill="#a0a0b4">}</text>
    <text x="100" y="265" fill="#8b5cf6">export default</text><text x="215" y="265" fill="#22d3ee">sanitizeInput</text><text x="330" y="265" fill="#a0a0b4">;</text>
  </g>
